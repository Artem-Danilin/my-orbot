name: Build Custom Orbot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Удаляем мешающий скрипт, который вызывает сбой компилятора Kotlin
      - name: Remove stray script file
        run: |
          rm -f app/src/main/java/org/torproject/android/service/BridgeDownloader.main.kts
          rm -f app/src/main/java/org/torproject/android/BridgeDownloader.main.kts

      # Инициализируем Си-библиотеки туннеля напрямую
      - name: Checkout Submodules Manually
        run: |
          git submodule init
          git submodule update --init --recursive --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Запускаем сборку через встроенный компилятор сервера
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbot-Custom-Auto
          path: app/build/outputs/apk/debug/app-debug.apk
