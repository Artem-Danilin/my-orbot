name: Build Custom Orbot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # Убраны параметры ref и token, теперь Git автоматически скачает нужный код

      # Скачиваем Си-код напрямую с серверов разработчиков, исправляя symlinks
      - name: Checkout Submodules Manually
        run: |
          git submodule init
          git submodule update --init --recursive --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbot-Custom-Auto
          path: app/build/outputs/apk/debug/app-debug.apk
